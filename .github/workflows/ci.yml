name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: economist_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U user -d economist_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:123456@127.0.0.1:5432/economist_db?serverVersion=18&charset=utf8

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, bcmath
          ini-values: date.timezone=UTC
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer validate --strict --no-check-publish
      - run: composer install --no-progress
      - run: composer audit
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: bin/console cache:warmup --env=dev
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --fail-on-uncovered --no-progress
      - run: bin/console lint:container
      - run: bin/console doctrine:database:create --env=test --if-not-exists
      - run: bin/console doctrine:migrations:migrate --env=test -n --allow-no-migration
      - run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
