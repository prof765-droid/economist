version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]
      # 7.x объявила OpenApi\Attributes устаревшими, а nelmio 5.13 нового OpenApi\Spec не видит (дизайн 4.6).
      # Снять, когда nelmio начнёт поддерживать OpenApi\Spec.
      - dependency-name: "zircote/swagger-php"
        update-types: ["version-update:semver-major"]
    groups:
      symfony:
        patterns: ["symfony/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
