# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Ошибка ввода пользователя — не авария: без этого ErrorListener пишет её в лог как CRITICAL,
    # и на проде fingers_crossed сбрасывал бы буфер логов на каждую опечатку в форме (дизайн 5).
    # Здесь, а не атрибутом #[WithLogLevel]: Domain не зависит от Symfony (Deptrac).
    exceptions:
        App\Domain\Mortgage\Credit\InvalidCreditTermsException: { log_level: info }

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
