# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/Mortgage/{Credit,Schedule}/'
            - '../src/Domain/Mortgage/Money.php'
            - '../src/Domain/Mortgage/Calculation/Calculation.php'

    # Стратегии расчёта графика (дизайн 3.2): каждый класс с этим интерфейсом получает тег,
    # MortgageCalculator собирает все помеченные сервисы. Здесь, а не атрибутами
    # (#[AutoconfigureTag], #[AutowireIterator]): это классы Symfony, Domain от них не зависит (Deptrac).
    _instanceof:
        App\Domain\Mortgage\Calculator\PaymentScheduleCalculator:
            tags: ['mortgage.payment_schedule_calculator']

    App\Domain\Mortgage\Calculator\MortgageCalculator:
        arguments:
            $calculators: !tagged_iterator mortgage.payment_schedule_calculator

    # Ключи — имена роутов (= FQCN контроллера, дизайн 4.1). В YAML нет ::class: опечатку
    # или переименование контроллера ловит RateLimitTest — лимит перестанет срабатывать.
    App\UI\Http\RateLimitListener:
        arguments:
            $limiters:
                'App\UI\Http\Controller\SaveCalculationController': '@limiter.calculation_save'
                'App\UI\Http\Controller\CalculateMortgageController': '@limiter.mortgage_calculate'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
